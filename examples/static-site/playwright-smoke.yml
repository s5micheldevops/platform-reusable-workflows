name: Smoke - Playwright

# Copy this file into a static website repository at:
# .github/workflows/playwright-smoke.yml
#
# This caller workflow should run after a staging deployment is available.
# The reusable workflow lives in platform-reusable-workflows.
# Reusable workflows must be called with jobs.<job_id>.uses, not as a normal step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    name: Call reusable Playwright smoke workflow
    uses: s5micheldevops/platform-reusable-workflows/.github/workflows/reusable-playwright-smoke.yml@main
    with:
      target_url: https://staging.example.com
      check_privacy_page: true
      check_contact_section: true
      check_language_toggle: false
