name: Reusable - JavaScript and TypeScript SAST

# Compatibility note: the filename retains the historical "eslint" name used
# by existing callers. SAST engine v1 is Semgrep Community Edition, not ESLint.
on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: false
        default: "."
        description: "Directory containing JavaScript, TypeScript, or React source to scan."

permissions:
  contents: read

jobs:
  sast:
    name: Semgrep CE SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
      # Pinned to an immutable commit SHA (never @main or a branch for a
      # published workflow). scripts/release/pin-composites.sh rewrites this to
      # the SHA that holds the composite action and its scripts, keeping the
      # workflow, the action and the scripts on one coherent revision.
      - name: Run platform SAST
        uses: s5micheldevops/platform-reusable-workflows/actions/sast-javascript-typescript@aab03490681a1cc53d456286c85f324bb8c96a08 # pin:sast-javascript-typescript
        with:
          working_directory: ${{ inputs.working_directory }}
