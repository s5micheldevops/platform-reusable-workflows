name: Reusable - Gitleaks Secret Scan

on:
  workflow_call:
    inputs:
      fetch_depth:
        type: number
        required: false
        default: 0
        description: "Git fetch depth. Use 0 to scan full history."
      fail_on_error:
        type: boolean
        required: false
        default: true
        description: "Fail the job when Gitleaks detects secrets."
      redact:
        type: boolean
        required: false
        default: true
        description: "Redact detected secrets from logs."

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          # The caller repository is the application, website, or infrastructure repo being scanned.
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Run platform Gitleaks composite action
        uses: s5micheldevops/platform-reusable-workflows/actions/gitleaks-scan@main
        with:
          fetch_depth: ${{ inputs.fetch_depth }}
          fail_on_error: ${{ inputs.fail_on_error }}
          redact: ${{ inputs.redact }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
